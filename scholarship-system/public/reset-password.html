<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10243E">
<title>Reset password | ScholarTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2310243E'/%3E%3Cpath d='M50 24 14 42l36 18 28-14v22h6V42z' fill='%23F5B335'/%3E%3Cpath d='M30 58v14c0 5 9 12 20 12s20-7 20-12V58L50 68z' fill='%23F5B335'/%3E%3C/svg%3E">
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-aside">
    <a class="brand text-white" href="/"><span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span><span class="brand-name">ScholarTrack</span></a>
    <div>
      <h2 class="mb-3">Almost there.</h2>
      <p class="quote mb-0">Pick a password you have not used before. You will be asked to log in again afterwards.</p>
    </div>
    <div class="small" style="color:#8FA3BB">Scholarship Application and Tracking System</div>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      <a class="brand d-lg-none mb-4 text-dark" href="/"><span class="brand-mark" style="background:var(--ink);color:var(--gold)"><i class="bi bi-mortarboard-fill"></i></span><span class="brand-name">ScholarTrack</span></a>

      <h1 class="h2 mb-1">Choose a new password</h1>
      <p class="text-muted mb-4">Use at least 8 characters with a letter and a number.</p>
      <div class="panel panel-pad">
        <form id="resetForm" novalidate>
          <div class="mb-3"><label class="form-label" for="password">New password</label>
            <div class="input-icon"><i class="bi bi-lock"></i><input type="password" class="form-control" id="password" autocomplete="new-password" required style="padding-right:3rem"><button type="button" class="pw-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
          <div class="mb-3"><label class="form-label" for="confirmPassword">Confirm new password</label>
            <div class="input-icon"><i class="bi bi-lock-fill"></i><input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" required></div></div>
          <div class="alert alert-danger py-2 small d-none" id="formError" role="alert"></div>
          <button class="btn btn-primary w-100 btn-lg" type="submit" id="resetBtn">Update password</button>
        </form>
      </div>
      <p class="text-center mt-4 mb-0"><a class="fw-semibold" href="/login.html"><i class="bi bi-arrow-left me-1"></i>Back to log in</a></p>

    </div>
  </main>
</div>
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/forgot.js"></script>
</body>
</html>
