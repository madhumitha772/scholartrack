<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10243E">
<title>Admin dashboard | ScholarTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2310243E'/%3E%3Cpath d='M50 24 14 42l36 18 28-14v22h6V42z' fill='%23F5B335'/%3E%3Cpath d='M30 58v14c0 5 9 12 20 12s20-7 20-12V58L50 68z' fill='%23F5B335'/%3E%3C/svg%3E">
</head>
<body class="is-loading">
<div class="app-layout">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="app-content">

<div class="row g-3 mb-4">
  <div class="col-6 col-xl-2"><div class="kpi"><span class="kpi-icon i-sky"><i class="bi bi-people"></i></span><div><div class="num" id="kStudents">–</div><div class="lbl">Students</div></div></div></div>
  <div class="col-6 col-xl-2"><div class="kpi"><span class="kpi-icon i-teal"><i class="bi bi-award"></i></span><div><div class="num" id="kSch">–</div><div class="lbl">Scholarships</div></div></div></div>
  <div class="col-6 col-xl-2"><div class="kpi"><span class="kpi-icon i-ink"><i class="bi bi-inboxes"></i></span><div><div class="num" id="kApps">–</div><div class="lbl">Applications</div></div></div></div>
  <div class="col-6 col-xl-2"><div class="kpi"><span class="kpi-icon i-amber"><i class="bi bi-hourglass-split"></i></span><div><div class="num" id="kPending">–</div><div class="lbl">Pending</div></div></div></div>
  <div class="col-6 col-xl-2"><div class="kpi"><span class="kpi-icon i-leaf"><i class="bi bi-check2-circle"></i></span><div><div class="num" id="kApproved">–</div><div class="lbl">Approved</div></div></div></div>
  <div class="col-6 col-xl-2"><div class="kpi"><span class="kpi-icon i-rose"><i class="bi bi-x-circle"></i></span><div><div class="num" id="kRejected">–</div><div class="lbl">Rejected</div></div></div></div>
</div>
<div class="row g-4">
  <div class="col-xl-8">
    <div class="panel mb-4"><div class="panel-head"><h5>Latest applications</h5><a class="btn btn-soft btn-sm" href="/admin/applications.html">Review all</a></div><div class="table-wrap" id="recent"><div class="page-loading">Loading…</div></div></div>
  </div>
  <div class="col-xl-4">
    <div class="panel mb-4"><div class="panel-head"><h5>Applications by status</h5></div><div class="panel-body"><div class="chart-box" style="height:240px"><canvas id="statusChart"></canvas></div></div></div>
    <div class="panel"><div class="panel-head"><h5>Closing soon</h5><a class="btn btn-soft btn-sm" href="/admin/scholarships.html">Manage</a></div><div id="closing" class="p-2"><div class="page-loading">Loading…</div></div></div>
  </div>
</div>

    </main>
  </div>
</div>
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/vendor/chartjs/chart.umd.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
