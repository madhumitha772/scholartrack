<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard | ScholarTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">

<link href="/css/style.css" rel="stylesheet">

<body class="is-loading">
<div class="app-layout">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="app-content">

<div class="welcome mb-4" id="welcome"><div class="skeleton" style="height:64px;max-width:420px;opacity:.2"></div></div>
<div id="actionAlert"></div>
<div class="row g-3 mb-4" id="kpis">
  <div class="col-6 col-xl"><div class="kpi"><span class="kpi-icon i-teal"><i class="bi bi-award"></i></span><div><div class="num" id="kAvail">–</div><div class="lbl">Open scholarships</div></div></div></div>
  <div class="col-6 col-xl"><div class="kpi"><span class="kpi-icon i-sky"><i class="bi bi-send"></i></span><div><div class="num" id="kTotal">–</div><div class="lbl">Applications</div></div></div></div>
  <div class="col-6 col-xl"><div class="kpi"><span class="kpi-icon i-amber"><i class="bi bi-hourglass-split"></i></span><div><div class="num" id="kPending">–</div><div class="lbl">In progress</div></div></div></div>
  <div class="col-6 col-xl"><div class="kpi"><span class="kpi-icon i-leaf"><i class="bi bi-check2-circle"></i></span><div><div class="num" id="kApproved">–</div><div class="lbl">Approved</div></div></div></div>
  <div class="col-12 col-xl"><div class="kpi"><span class="kpi-icon i-rose"><i class="bi bi-x-circle"></i></span><div><div class="num" id="kRejected">–</div><div class="lbl">Rejected</div></div></div></div>
</div>
<div class="row g-4">
  <div class="col-xl-8">
    <div class="panel">
      <div class="panel-head"><h5>Recent applications</h5><a class="btn btn-soft btn-sm" href="/my-applications.html">View all</a></div>
      <div class="table-wrap" id="recent"><div class="page-loading">Loading…</div></div>
    </div>
  </div>
  <div class="col-xl-4">
    <div class="panel mb-4">
      <div class="panel-head"><h5>Closing soon</h5><a class="btn btn-soft btn-sm" href="/scholarships.html">Browse</a></div>
      <div id="closing" class="p-2"><div class="page-loading">Loading…</div></div>
    </div>
    <div class="panel panel-pad" id="profileCard"></div>
  </div>
</div>

    </main>
  </div>
</div>
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
