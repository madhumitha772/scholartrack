<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10243E">
<title>Scholarships | ScholarTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2310243E'/%3E%3Cpath d='M50 24 14 42l36 18 28-14v22h6V42z' fill='%23F5B335'/%3E%3Cpath d='M30 58v14c0 5 9 12 20 12s20-7 20-12V58L50 68z' fill='%23F5B335'/%3E%3C/svg%3E">
</head>
<body class="is-loading">
<div class="app-layout">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="app-content">

<div class="panel panel-pad py-3 mb-3"><div class="row g-2 align-items-center">
  <div class="col-md-5"><div class="input-icon"><i class="bi bi-search"></i><input type="search" class="form-control" id="q" placeholder="Search scholarships" aria-label="Search scholarships"></div></div>
  <div class="col-md-3"><select class="form-select" id="fStatus" aria-label="Filter by status"><option value="All">All</option><option>Active</option><option>Closed</option></select></div>
  <div class="col-md-4 text-md-end"><button class="btn btn-primary" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add scholarship</button></div>
</div></div>
<div class="panel"><div class="table-wrap" id="list"><div class="page-loading">Loading…</div></div></div>

    </main>
  </div>
</div>

<div class="modal fade" id="schModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered"><form class="modal-content" id="schForm" novalidate>
  <div class="modal-header"><h5 class="modal-title" id="schTitle">Add scholarship</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
    <h6 class="section-title"><i class="bi bi-info-circle"></i>Basic details</h6>
    <div class="row g-3 mb-4">
      <div class="col-md-8"><label class="form-label" for="name">Scholarship name</label><input class="form-control" id="name" required><div class="invalid-feedback">Enter a name.</div></div>
      <div class="col-md-4"><label class="form-label" for="provider">Provider</label><input class="form-control" id="provider" placeholder="e.g. ABC Foundation"></div>
      <div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" rows="3"></textarea></div>
      <div class="col-md-4"><label class="form-label" for="amount">Amount (₹)</label><input type="number" min="0" class="form-control" id="amount" required><div class="invalid-feedback">Enter the amount.</div></div>
      <div class="col-md-4"><label class="form-label" for="deadline">Application deadline</label><input type="date" class="form-control" id="deadline" required><div class="invalid-feedback">Select a deadline.</div></div>
      <div class="col-md-4"><label class="form-label" for="status">Status</label><select class="form-select" id="status"><option>Active</option><option>Closed</option></select></div>
    </div>
    <h6 class="section-title"><i class="bi bi-funnel"></i>Eligibility criteria</h6>
    <div class="row g-3 mb-4">
      <div class="col-12"><label class="form-label" for="eligibility">Eligibility summary</label><textarea class="form-control" id="eligibility" rows="2" placeholder="Shown to students in plain words"></textarea></div>
      <div class="col-md-3"><label class="form-label" for="minCgpa">Minimum CGPA</label><input type="number" min="0" max="10" step="0.1" class="form-control" id="minCgpa" placeholder="0 = none"></div>
      <div class="col-md-3"><label class="form-label" for="incomeLimit">Max family income (₹)</label><input type="number" min="0" class="form-control" id="incomeLimit" placeholder="0 = no limit"></div>
      <div class="col-md-3"><label class="form-label" for="category">Category</label><select class="form-select" id="category"><option>All</option><option>General</option><option>OBC</option><option>SC</option><option>ST</option><option>EWS</option><option>Minority</option></select></div>
      <div class="col-md-3"><label class="form-label" for="gender">Gender</label><select class="form-select" id="gender"><option>All</option><option>Female</option><option>Male</option></select></div>
      <div class="col-md-6"><label class="form-label" for="course">Course</label><input class="form-control" id="course" list="courseList" value="All"><datalist id="courseList"></datalist></div>
      <div class="col-md-6"><label class="form-label" for="state">State</label><select class="form-select" id="state"><option>All</option></select></div>
    </div>
    <h6 class="section-title"><i class="bi bi-files"></i>Documents, selection and contact</h6>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="requiredDocuments">Required documents</label><textarea class="form-control" id="requiredDocuments" rows="5" placeholder="One per line&#10;ID Proof&#10;Marksheet&#10;Income Certificate"></textarea><div class="form-text">One document per line. Students upload each one while applying.</div></div>
      <div class="col-md-6"><label class="form-label" for="selectionCriteria">Selection criteria</label><textarea class="form-control" id="selectionCriteria" rows="5"></textarea></div>
      <div class="col-md-6"><label class="form-label" for="contactEmail">Contact email</label><input type="email" class="form-control" id="contactEmail"></div>
      <div class="col-md-6"><label class="form-label" for="contactPhone">Contact phone</label><input class="form-control" id="contactPhone"></div>
    </div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit" id="schSave">Save scholarship</button></div>
</form></div></div><script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin-scholarships.js"></script>
</body>
</html>
