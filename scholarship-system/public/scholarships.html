<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10243E">
<title>Find scholarships | ScholarTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2310243E'/%3E%3Cpath d='M50 24 14 42l36 18 28-14v22h6V42z' fill='%23F5B335'/%3E%3Cpath d='M30 58v14c0 5 9 12 20 12s20-7 20-12V58L50 68z' fill='%23F5B335'/%3E%3C/svg%3E">
</head>
<body>
<header class="pub-nav" id="publicNav"></header>

<section class="page-banner">
  <div class="container">
    <h1>Find a scholarship that fits you</h1>
    <p class="mb-4">Search by name or provider, then narrow down by course, category, income and more.</p>
    <form class="row g-2" id="searchForm" role="search" style="max-width:720px">
      <div class="col"><div class="input-icon"><i class="bi bi-search"></i><input type="search" class="form-control form-control-lg" id="q" placeholder="Search by scholarship name or provider" aria-label="Search scholarships"></div></div>
      <div class="col-auto"><button class="btn btn-gold btn-lg" type="submit">Search</button></div>
    </form>
  </div>
</section>
<section class="container py-4 pull-up">
  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="panel panel-pad filters">
        <div class="d-flex justify-content-between align-items-center mb-3"><h6 class="mb-0">Filters</h6><button class="btn btn-link btn-sm p-0 fw-semibold" id="clearBtn" type="button">Clear all</button></div>
        <button class="btn btn-soft w-100 mb-3 d-none" id="matchBtn" type="button"><i class="bi bi-magic me-1"></i>Match my profile</button>
        <div class="mb-3"><label class="form-label" for="fCategory">Category</label><select class="form-select" id="fCategory"></select></div>
        <div class="mb-3"><label class="form-label" for="fCourse">Course</label><select class="form-select" id="fCourse"></select></div>
        <div class="mb-3"><label class="form-label" for="fGender">Gender</label><select class="form-select" id="fGender"><option value="">Any</option><option>Female</option><option>Male</option></select></div>
        <div class="mb-3"><label class="form-label" for="fState">State</label><select class="form-select" id="fState"></select></div>
        <div class="mb-3"><label class="form-label" for="fCgpa">My CGPA</label><input type="number" class="form-control" id="fCgpa" min="0" max="10" step="0.1" placeholder="e.g. 8.2"><div class="form-text">Shows scholarships you meet the CGPA requirement for.</div></div>
        <div class="mb-3"><label class="form-label" for="fIncome">My family income (₹ per year)</label><input type="number" class="form-control" id="fIncome" min="0" step="10000" placeholder="e.g. 300000"></div>
        <div class="mb-3"><label class="form-label" for="fSort">Sort by</label><select class="form-select" id="fSort"><option value="deadline">Closing soonest</option><option value="amount">Highest amount</option><option value="newest">Newest</option></select></div>
        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="fOpen" checked><label class="form-check-label" for="fOpen">Only open scholarships</label></div>
      </div>
    </aside>
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3"><div class="fw-semibold" id="resultCount" aria-live="polite">Loading…</div></div>
      <div class="row g-4" id="results"></div>
    </div>
  </div>
</section>

<footer class="pub-footer" id="publicFooter"></footer>
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/scholarships.js"></script>
</body>
</html>
